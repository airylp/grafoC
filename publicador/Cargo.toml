[package]
name = "grafo-publicador"
version = "0.1.0"
edition = "2024"
description = "Pequeño servidor web para publicar y descargar los ejecutables de grafo"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
